name: Bug report
description: Something isn't working as documented
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not** include secrets, API keys, tokens, or
        real customer data — redact logs and config before pasting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, request shape, or config that triggers it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag or commit SHA.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - gateway (data plane)
        - control-api (admin/config)
        - web (admin console)
        - infra / deploy
        - other / unsure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redacted logs or error output.
      render: shell
