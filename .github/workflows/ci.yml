name: CI

on:
  push:
    branches: [main]
  pull_request:

# No scheduled triggers — dependency updates are manual and grouped by design.

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: bash ci/install.sh
      - name: Verify
        run: bash ci/verify.sh
