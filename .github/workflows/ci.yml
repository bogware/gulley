name: CI

on:
  push:
    branches: [main]
  pull_request:

# No scheduled triggers — dependency updates are manual and grouped by design.

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: bash ci/install.sh
      - name: Verify
        # format / lint / typecheck / test (incl. the M1-M5 credential-leak,
        # ReDoS, and guard fuzz tests) / build.
        run: bash ci/verify.sh

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Terraform fmt + validate (dev + prod)
        run: bash ci/tf-check.sh
