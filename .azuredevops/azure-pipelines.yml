# Azure DevOps pipeline — kept at parity with .github/workflows/ci.yml by
# delegating all logic to the shared ci/ scripts.
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - '*'

# SECURITY: this PR pipeline runs untrusted fork code (pnpm install/test/build) —
# keep it on a Microsoft-hosted pool. Never point it at a self-hosted pool. In the
# project's pipeline settings keep "Make secrets available to fork PR builds" OFF
# and require a maintainer comment before building a fork PR (see docs/CI_SECURITY.md).
pool:
  vmImage: ubuntu-latest

jobs:
  - job: verify
    displayName: Verify
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: '22.x'
        displayName: Install Node.js
      - script: bash ci/install.sh
        displayName: Install
      - script: bash ci/verify.sh
        displayName: Verify (format/lint/types/tests/build)

  - job: hotpath
    displayName: Hot-path review guard
    steps:
      # Azure shallow-clones by default; fetch history so the diff vs origin/main
      # is available to ci/hotpath-guard.sh.
      - checkout: self
        fetchDepth: 0
      - script: HOTPATH_STRICT=1 bash ci/hotpath-guard.sh
        displayName: Hot-path review guard (strict)

  - job: deploy_manifests
    displayName: Deploy manifests (helm + compose)
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: '22.x'
        displayName: Install Node.js
      - script: |
          set -euo pipefail
          curl -fsSL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          bash ci/install.sh
          bash ci/helm-check.sh
        displayName: Helm lint/template + compose structural checks

  - job: terraform
    displayName: Terraform
    steps:
      - script: |
          set -euo pipefail
          curl -fsSL "https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip" -o /tmp/tf.zip
          sudo unzip -o /tmp/tf.zip -d /usr/local/bin
          bash ci/tf-check.sh
        displayName: Terraform fmt + validate
