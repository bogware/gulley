# Azure DevOps release pipeline — at parity with .github/workflows/release.yml.
# Manual/tag only (no scheduled trigger). Builds + pushes the image via the shared
# ci/build-image.sh and runs a prod terraform plan. AWS auth comes from an AWS
# service connection (OIDC); ECR_REPOSITORY / AWS_REGION are pipeline variables.
trigger: none

pr: none

parameters:
  - name: imageTag
    type: string
    # No default: a run must name the tag (never `latest`; the script refuses it).

pool:
  vmImage: ubuntu-latest

variables:
  - group: gulley-release # AWS_REGION, ECR_REPOSITORY (+ AWS creds via service connection)

stages:
  - stage: image
    displayName: Build + push image
    jobs:
      - job: build
        steps:
          - task: AWSShellScript@1
            displayName: Build + push (SBOM + provenance + cosign) and scan
            inputs:
              awsCredentials: gulley-aws
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                set -euo pipefail
                export IMAGE_TAG='${{ parameters.imageTag }}'
                if [ "$IMAGE_TAG" = "latest" ]; then
                  echo "refusing to publish :latest from a manual run" >&2; exit 1
                fi
                # cosign for keyless signing (build-image.sh signs the digest), with the
                # binary verified against the release's published checksums. Keyless in
                # Azure DevOps needs the pipeline OIDC to be enabled; SKIP_SIGN=1 skips.
                COSIGN_VERSION=v2.4.1
                curl -fsSL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o cosign-linux-amd64
                curl -fsSL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign_checksums.txt" -o cosign_checksums.txt
                grep ' cosign-linux-amd64$' cosign_checksums.txt | sha256sum -c -
                install -m 0755 cosign-linux-amd64 /usr/local/bin/cosign
                # Pin the Trivy installer to a release TAG (never pipe the main
                # branch into a shell in a credentialed stage).
                TRIVY_VERSION=v0.74.0
                curl -fsSL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" \
                  | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
                # Scan BEFORE the push: build the amd64 image locally, gate it, then
                # build-image.sh pushes the (signed) target-platform image. Distroless +
                # production deps only: no skip-dirs, no ignore file.
                docker buildx build --platform linux/amd64 \
                  --build-arg "GULLEY_VERSION=$IMAGE_TAG" \
                  --build-arg "GULLEY_BUILD_SHA=$(git rev-parse --short HEAD)" \
                  --file apps/gateway/Dockerfile --load --tag gulley-scan:local .
                trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 gulley-scan:local
                bash ci/build-image.sh

  # IaC sanity: fmt + validate the single Terraform module. A real prod plan/apply
  # is operator-driven with your own backend + tfvars (infra/terraform/INSTALL.md),
  # so this stage needs no AWS credentials.
  - stage: terraform_validate
    displayName: Terraform fmt + validate
    dependsOn: image
    jobs:
      - job: validate
        steps:
          - script: |
              set -euo pipefail
              curl -fsSL "https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip" -o /tmp/tf.zip
              sudo unzip -o /tmp/tf.zip -d /usr/local/bin
              bash ci/tf-check.sh
            displayName: terraform fmt + validate
