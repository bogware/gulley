# Self-host: the gateway + control-api (one image, two commands) plus Postgres and
# the role-split Redis trio. From the repo root:
#
#   cp .env.example deploy/.env      # fill provider keys, GULLEY_KEY_PEPPER, POSTGRES_PASSWORD
#   docker compose -f deploy/docker-compose.prod.yml up -d postgres
#   docker compose -f deploy/docker-compose.prod.yml run --rm --workdir /app/packages/storage \
#     control-api pnpm db:migrate         # apply the schema to a fresh database
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# Secrets live only in deploy/.env (gitignored) — never commit it. POSTGRES_PASSWORD
# is required (compose fails closed if unset). The image tag defaults to `latest`;
# pin GULLEY_TAG for a real deployment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gulley
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: gulley
    volumes:
      - gulley_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gulley -d gulley']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    restart: unless-stopped

  redis-counters:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
    volumes:
      - gulley_redis_counters:/data
    restart: unless-stopped

  redis-vector:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
    restart: unless-stopped

  gateway:
    image: ${GULLEY_IMAGE:-ghcr.io/bogware/gulley}:${GULLEY_TAG:-latest}
    # The image's default command starts the gateway from its app dir (so pnpm's
    # isolated `tsx` resolves); no command override needed.
    env_file:
      - .env
    environment:
      GATEWAY_PORT: '8080'
      METRICS_PORT: '9090'
      DATABASE_URL: postgres://gulley:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/gulley
      REDIS_CACHE_URL: redis://redis-cache:6379
      REDIS_COUNTERS_URL: redis://redis-counters:6379
      REDIS_VECTOR_URL: redis://redis-vector:6379
    ports:
      - '8080:8080'
      - '9090:9090'
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-counters:
        condition: service_started
      redis-vector:
        condition: service_started
    restart: unless-stopped

  control-api:
    image: ${GULLEY_IMAGE:-ghcr.io/bogware/gulley}:${GULLEY_TAG:-latest}
    # Same image; run the control-api from its own app dir so `tsx` resolves.
    working_dir: /app/apps/control-api
    command: ['node', '--import', 'tsx', 'src/main.ts']
    env_file:
      - .env
    environment:
      CONTROL_API_PORT: '8081'
      DATABASE_URL: postgres://gulley:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/gulley
      REDIS_CACHE_URL: redis://redis-cache:6379
      REDIS_COUNTERS_URL: redis://redis-counters:6379
      REDIS_VECTOR_URL: redis://redis-vector:6379
    ports:
      - '8081:8081'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gulley_pg:
  gulley_redis_counters:
