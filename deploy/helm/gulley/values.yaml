# Default values for the gulley chart.
# One image runs either plane; each Deployment overrides the container `command`.

image:
  repository: ghcr.io/bogware/gulley
  # Defaults to the chart's appVersion when empty. Pin a release tag (or a digest) in
  # production; a mutable `latest` tag is pulled with pullPolicy Always automatically.
  tag: ''
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  create: true
  name: ''
  # e.g. eks.amazonaws.com/role-arn for IRSA (Bedrock SigV4 / Secrets Manager).
  annotations: {}

# Non-secret environment shared by both planes → rendered into a ConfigMap.
# Secret VALUES never live here (secret-ARNs-only): put provider keys, the KMS
# pepper, etc. in a Kubernetes Secret and name it under `existingSecret`.
config:
  # A credential-bearing URL (postgres://user:PASSWORD@…) must NOT go here — the
  # ConfigMap is readable by anyone who can read the namespace. Put DATABASE_URL in the
  # Secret named by `existingSecret` instead; the chart refuses to render a value with
  # `@` in it (set allowCredentialsInConfig: true to override, e.g. IAM-auth URLs).
  DATABASE_URL: ''
  REDIS_CACHE_URL: ''
  REDIS_COUNTERS_URL: ''
  REDIS_VECTOR_URL: ''
  LOG_LEVEL: info
  # Arbitrary extra non-secret env (merged verbatim into the ConfigMap).
  extra: {}
allowCredentialsInConfig: false

# Name of a pre-existing Kubernetes Secret whose keys are projected as env into
# both pods (envFrom). Empty = no secret env (dev / secrets injected elsewhere).
# IMPORTANT: every key in that Secret must EXACTLY equal a config.ts env var name
# (envFrom projects keys verbatim, unprefixed) — e.g. GULLEY_KEY_PEPPER, not KEY_PEPPER.
existingSecret: ''

# --- Data plane (the stateless hot path) ---
gateway:
  enabled: true
  replicaCount: 2
  port: 8080
  metricsPort: 9090
  # The image's ENTRYPOINT is node; the command is the bundled entry (WORKDIR /app).
  command: ['dist/gateway/main.mjs']
  # Node heap cap. Keep it ~75% of resources.limits.memory: an uncapped heap lets a
  # burst grow into the cgroup limit and get OOM-killed mid-stream instead of GC'ing.
  nodeOptions: '--max-old-space-size=384'
  # Prometheus scrape annotations on the pod (for annotation-based discovery).
  metricsAnnotations: true
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    # CPU alone under-scales a streaming proxy (its load is connection/event-loop
    # bound). Add Pods/External metrics driven by the gateway's own Prometheus
    # metrics (active in-flight requests per pod, event-loop lag) via a metrics
    # adapter (prometheus-adapter / KEDA) — CPU stays as a coarse fallback. Each
    # entry is a full autoscaling/v2 metric spec, appended verbatim to the HPA.
    # REQUIRES an in-cluster metrics adapter AND that the gateway export the named
    # metric; leave empty on clusters without one (CPU-only). Example:
    #   customMetrics:
    #     - type: Pods
    #       pods:
    #         metric: { name: gulley_gateway_inflight_requests }
    #         target: { type: AverageValue, averageValue: '40' }
    customMetrics: []
  # SIGTERM → bounded graceful drain. MUST exceed SHUTDOWN_GRACE_MS (derived below)
  # so the app's process.exit backstop fires a few seconds BEFORE k8s SIGKILL —
  # otherwise an in-flight SSE stream is cut mid-drain and its single teardown()
  # (budget-commit + ledger + hash-chained audit row) never runs.
  terminationGracePeriodSeconds: 120
  # SHUTDOWN_GRACE_MS is derived per plane as
  # (terminationGracePeriodSeconds - preStopSleepSeconds - drainBufferSeconds) * 1000,
  # so the app's drain backstop fires before SIGKILL even after the preStop sleep. The
  # chart refuses to render when that comes out <= 0.
  drainBufferSeconds: 10
  # preStop sleep (seconds): on SIGTERM the pod sleeps this long BEFORE the app
  # begins draining, so Service endpoint removal propagates first and in-flight
  # requests stop landing on a terminating pod (kills the deregistration-race 502s).
  # Must fit inside terminationGracePeriodSeconds. (The image has no shell: the sleep
  # runs through node.)
  preStopSleepSeconds: 10
  # Probe budgets: 5 s timeouts (1 s false-fails a GC pause or a cold DB pool), and a
  # startupProbe that gives a DB-config gateway up to failureThreshold*periodSeconds to
  # load its route table before liveness can restart it.
  probes:
    timeoutSeconds: 5
    startup:
      periodSeconds: 5
      failureThreshold: 24
  podDisruptionBudget:
    enabled: true
    # maxUnavailable (not minAvailable) so a scale-down to 1 replica can't deadlock
    # a node drain.
    maxUnavailable: 1

# --- Control plane (admin API; every write hash-chain audited) ---
controlApi:
  enabled: true
  replicaCount: 1
  port: 8081
  command: ['dist/control-api/main.mjs']
  nodeOptions: '--max-old-space-size=384'
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  terminationGracePeriodSeconds: 120
  drainBufferSeconds: 10
  preStopSleepSeconds: 5
  probes:
    timeoutSeconds: 5
    startup:
      periodSeconds: 5
      failureThreshold: 24

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  # emptyDir /tmp is group-writable for the non-root user under readOnlyRootFilesystem.
  fsGroup: 1000
  # RuntimeDefault seccomp so the pods meet the restricted Pod Security Standard and
  # run with kernel-syscall confinement.
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ['ALL']

# Soft pod-anti-affinity default spreads each plane's replicas across nodes so one
# node loss can't take out all of them (the 2-replica HA posture is otherwise
# illusory). Kept "preferred" so single-node/dev clusters still schedule. Pair with
# the PodDisruptionBudget (voluntary drains) for real HA. Any value here fully
# OVERRIDES this default.
affinity: {}
# When affinity is empty, use this default anti-affinity topology key.
defaultAntiAffinityTopologyKey: kubernetes.io/hostname

nodeSelector: {}
tolerations: []

# Opt-in NetworkPolicy (default off — a CNI that ignores NetworkPolicy would make it
# a no-op, and the egress half needs the real Postgres/Redis/provider CIDRs). Gives
# the code-level egress/SSRF lockdown a network-layer parity when the CNI enforces it.
networkPolicy:
  enabled: false
  # Namespaces allowed to reach the gateway data port (label selector match). Empty
  # = same-namespace only.
  ingressNamespaceSelector: {}
  # Namespace (by label) allowed to scrape the metrics port — your monitoring stack.
  metricsNamespaceSelector: {}
  # Egress allowlist. DNS (kube-dns) is always allowed; add the Postgres/Redis/provider
  # CIDRs here. Empty egress list = egress policy NOT emitted (many CNIs ignore it).
  egressCIDRs: []
  egressPorts: []

# Opt-in Ingress for the gateway (default off; operators often front it with their
# own gateway/ALB). TLS is emitted when tls[] is set. Streaming responses (SSE) run
# for minutes: raise the controller's proxy read/send timeouts above the longest
# expected stream, e.g. for ingress-nginx:
#   annotations:
#     nginx.ingress.kubernetes.io/proxy-read-timeout: '600'
#     nginx.ingress.kubernetes.io/proxy-send-timeout: '600'
#     nginx.ingress.kubernetes.io/proxy-buffering: 'off'
ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts:
    - host: gulley.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
