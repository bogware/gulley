{{- if .Values.gateway.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gulley.fullname" . }}-gateway
  labels:
    {{- include "gulley.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gulley.selectorLabels" (dict "root" . "plane" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gulley.selectorLabels" (dict "root" . "plane" "gateway") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "gulley.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds }}
      containers:
        - name: gateway
          image: {{ include "gulley.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.gateway.command | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # preStop sleep: on SIGTERM, wait for Service endpoint removal to propagate
          # before the app starts refusing, so in-flight requests stop landing on a
          # terminating pod (avoids the deregistration-race 502s on every rollout).
          {{- if gt (int .Values.gateway.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              exec:
                command: ['sh', '-c', 'sleep {{ .Values.gateway.preStopSleepSeconds }}']
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
            - name: metrics
              containerPort: {{ .Values.gateway.metricsPort }}
          envFrom:
            - configMapRef:
                name: {{ include "gulley.fullname" . }}-config
            {{- if .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- end }}
          # /health = liveness (always 200 once up); /ready = 503 until routes are
          # wired, so the LB only sends traffic to a fully-configured task.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- include "gulley.affinity" (dict "root" . "plane" "gateway") | nindent 8 }}
{{- end }}
