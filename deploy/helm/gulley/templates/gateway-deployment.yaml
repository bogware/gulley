{{- if .Values.gateway.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gulley.fullname" . }}-gateway
  labels:
    {{- include "gulley.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gulley.selectorLabels" (dict "root" . "plane" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gulley.selectorLabels" (dict "root" . "plane" "gateway") | nindent 8 }}
      {{- if or .Values.podAnnotations .Values.gateway.metricsAnnotations }}
      annotations:
        {{- if .Values.gateway.metricsAnnotations }}
        prometheus.io/scrape: 'true'
        prometheus.io/port: {{ .Values.gateway.metricsPort | quote }}
        prometheus.io/path: /metrics
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "gulley.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds }}
      containers:
        - name: gateway
          image: {{ include "gulley.image" . }}
          imagePullPolicy: {{ include "gulley.pullPolicy" . }}
          command:
            {{- toYaml .Values.gateway.command | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            # Drain budget for THIS plane (see the shutdownGraceMs helper).
            - name: SHUTDOWN_GRACE_MS
              value: {{ include "gulley.shutdownGraceMs" (dict "plane" .Values.gateway "name" "gateway") | quote }}
            {{- with .Values.gateway.nodeOptions }}
            - name: NODE_OPTIONS
              value: {{ . | quote }}
            {{- end }}
          # preStop sleep: on SIGTERM, wait for Service endpoint removal to propagate
          # before the app starts refusing, so in-flight requests stop landing on a
          # terminating pod (avoids the deregistration-race 502s on every rollout).
          {{- if gt (int .Values.gateway.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              {{- include "gulley.preStop" .Values.gateway.preStopSleepSeconds | nindent 14 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
            - name: metrics
              containerPort: {{ .Values.gateway.metricsPort }}
          envFrom:
            - configMapRef:
                name: {{ include "gulley.fullname" . }}-config
            {{- if .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- end }}
          # startup = /health until the process is up (bounded), so liveness cannot
          # restart a slow boot; liveness = /health; readiness = /ready (503 until routes
          # are wired and the DB schema matches, so traffic only reaches a ready task).
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: {{ .Values.gateway.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.gateway.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.gateway.probes.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: {{ .Values.gateway.probes.timeoutSeconds }}
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: {{ .Values.gateway.probes.timeoutSeconds }}
            failureThreshold: 3
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- include "gulley.affinity" (dict "root" . "plane" "gateway") | nindent 8 }}
{{- end }}
