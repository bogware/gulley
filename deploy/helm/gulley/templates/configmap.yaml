apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gulley.fullname" . }}-config
  labels:
    {{- include "gulley.labels" . | nindent 4 }}
data:
  GATEWAY_PORT: {{ .Values.gateway.port | quote }}
  METRICS_PORT: {{ .Values.gateway.metricsPort | quote }}
  CONTROL_API_PORT: {{ .Values.controlApi.port | quote }}
  # SHUTDOWN_GRACE_MS is set PER PLANE on each Deployment (derived from that plane's
  # terminationGracePeriodSeconds / preStop / buffer), not here.
  {{- if and (not .Values.allowCredentialsInConfig) (contains "@" (default "" .Values.config.DATABASE_URL)) }}
  {{- fail "config.DATABASE_URL carries credentials (contains '@'); put it in the Secret named by existingSecret, or set allowCredentialsInConfig=true" }}
  {{- end }}
  {{- range $k, $v := .Values.config }}
  {{- if and (ne $k "extra") (kindIs "string" $v) }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.config.extra }}
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
