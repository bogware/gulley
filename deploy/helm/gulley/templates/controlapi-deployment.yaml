{{- if .Values.controlApi.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gulley.fullname" . }}-control-api
  labels:
    {{- include "gulley.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-api
spec:
  replicas: {{ .Values.controlApi.replicaCount }}
  selector:
    matchLabels:
      {{- include "gulley.selectorLabels" (dict "root" . "plane" "control-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gulley.selectorLabels" (dict "root" . "plane" "control-api") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "gulley.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.controlApi.terminationGracePeriodSeconds }}
      containers:
        - name: control-api
          image: {{ include "gulley.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.controlApi.command | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if gt (int .Values.controlApi.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              exec:
                command: ['sh', '-c', 'sleep {{ .Values.controlApi.preStopSleepSeconds }}']
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.controlApi.port }}
          envFrom:
            - configMapRef:
                name: {{ include "gulley.fullname" . }}-config
            {{- if .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controlApi.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- include "gulley.affinity" (dict "root" . "plane" "control-api") | nindent 8 }}
{{- end }}
