{{- if .Values.controlApi.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gulley.fullname" . }}-control-api
  labels:
    {{- include "gulley.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-api
spec:
  replicas: {{ .Values.controlApi.replicaCount }}
  selector:
    matchLabels:
      {{- include "gulley.selectorLabels" (dict "root" . "plane" "control-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gulley.selectorLabels" (dict "root" . "plane" "control-api") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "gulley.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.controlApi.terminationGracePeriodSeconds }}
      containers:
        - name: control-api
          image: {{ include "gulley.image" . }}
          imagePullPolicy: {{ include "gulley.pullPolicy" . }}
          command:
            {{- toYaml .Values.controlApi.command | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: SHUTDOWN_GRACE_MS
              value: {{ include "gulley.shutdownGraceMs" (dict "plane" .Values.controlApi "name" "controlApi") | quote }}
            {{- with .Values.controlApi.nodeOptions }}
            - name: NODE_OPTIONS
              value: {{ . | quote }}
            {{- end }}
          {{- if gt (int .Values.controlApi.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              {{- include "gulley.preStop" .Values.controlApi.preStopSleepSeconds | nindent 14 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.controlApi.port }}
          envFrom:
            - configMapRef:
                name: {{ include "gulley.fullname" . }}-config
            {{- if .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: {{ .Values.controlApi.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.controlApi.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.controlApi.probes.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: {{ .Values.controlApi.probes.timeoutSeconds }}
            failureThreshold: 3
          # /ready: 503 without an admin context (health-only boot) or while the database
          # schema is behind this build — /health alone marked a half-configured pod Ready.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: {{ .Values.controlApi.probes.timeoutSeconds }}
            failureThreshold: 3
          resources:
            {{- toYaml .Values.controlApi.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- include "gulley.affinity" (dict "root" . "plane" "control-api") | nindent 8 }}
{{- end }}
